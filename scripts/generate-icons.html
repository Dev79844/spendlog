<!DOCTYPE html>
<html>
<head>
  <title>SpendLog Icon Generator</title>
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 40px;
      padding: 40px;
      background: #1a1a1a;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .icon-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .label {
      color: #888;
      font-size: 14px;
    }
    .icon-row {
      display: flex;
      gap: 40px;
      flex-wrap: wrap;
      justify-content: center;
    }
  </style>
</head>
<body>
  <h1 style="color: white;">SpendLog Icons</h1>
  
  <div class="icon-row">
    <!-- Main Icon (1024x1024) -->
    <div class="icon-container">
      <svg id="main-icon" width="256" height="256" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#22C55E"/>
            <stop offset="100%" style="stop-color:#16A34A"/>
          </linearGradient>
          <linearGradient id="shineGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:rgba(255,255,255,0.25)"/>
            <stop offset="50%" style="stop-color:rgba(255,255,255,0)"/>
          </linearGradient>
          <filter id="innerShadow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur in="SourceAlpha" stdDeviation="20" result="blur"/>
            <feOffset in="blur" dx="0" dy="10" result="offsetBlur"/>
            <feComposite in="SourceGraphic" in2="offsetBlur" operator="over"/>
          </filter>
        </defs>
        
        <!-- Background -->
        <rect width="1024" height="1024" rx="224" fill="url(#bgGradient)"/>
        
        <!-- Subtle shine overlay -->
        <rect width="1024" height="1024" rx="224" fill="url(#shineGradient)"/>
        
        <!-- Dollar sign circle -->
        <circle cx="512" cy="420" r="200" fill="rgba(255,255,255,0.15)" stroke="white" stroke-width="12"/>
        
        <!-- Dollar sign -->
        <text x="512" y="470" text-anchor="middle" font-family="SF Pro Display, -apple-system, system-ui, sans-serif" font-size="280" font-weight="700" fill="white">$</text>
        
        <!-- SpendLog text -->
        <text x="512" y="780" text-anchor="middle" font-family="SF Pro Display, -apple-system, system-ui, sans-serif" font-size="140" font-weight="700" fill="white" letter-spacing="-4">spendlog</text>
        
        <!-- Subtle bottom line accent -->
        <rect x="312" y="820" width="400" height="6" rx="3" fill="rgba(255,255,255,0.4)"/>
      </svg>
      <span class="label">Main Icon (icon.png)</span>
    </div>

    <!-- Favicon (smaller, simpler) -->
    <div class="icon-container">
      <svg id="favicon" width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="bgGradient2" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#22C55E"/>
            <stop offset="100%" style="stop-color:#16A34A"/>
          </linearGradient>
        </defs>
        <rect width="64" height="64" rx="14" fill="url(#bgGradient2)"/>
        <text x="32" y="45" text-anchor="middle" font-family="SF Pro Display, -apple-system, system-ui, sans-serif" font-size="36" font-weight="700" fill="white">$</text>
      </svg>
      <span class="label">Favicon (favicon.png)</span>
    </div>
  </div>

  <div class="icon-row">
    <!-- Android Foreground -->
    <div class="icon-container">
      <svg id="android-foreground" width="256" height="256" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
        <!-- Transparent background, content only -->
        <!-- Dollar sign circle -->
        <circle cx="512" cy="420" r="200" fill="rgba(255,255,255,0.15)" stroke="white" stroke-width="12"/>
        
        <!-- Dollar sign -->
        <text x="512" y="470" text-anchor="middle" font-family="SF Pro Display, -apple-system, system-ui, sans-serif" font-size="280" font-weight="700" fill="white">$</text>
        
        <!-- SpendLog text -->
        <text x="512" y="780" text-anchor="middle" font-family="SF Pro Display, -apple-system, system-ui, sans-serif" font-size="140" font-weight="700" fill="white" letter-spacing="-4">spendlog</text>
        
        <!-- Subtle bottom line accent -->
        <rect x="312" y="820" width="400" height="6" rx="3" fill="rgba(255,255,255,0.4)"/>
      </svg>
      <span class="label">Android Foreground</span>
    </div>

    <!-- Android Background -->
    <div class="icon-container">
      <svg id="android-background" width="256" height="256" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="bgGradient3" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#22C55E"/>
            <stop offset="100%" style="stop-color:#16A34A"/>
          </linearGradient>
        </defs>
        <rect width="1024" height="1024" fill="url(#bgGradient3)"/>
      </svg>
      <span class="label">Android Background</span>
    </div>

    <!-- Android Monochrome -->
    <div class="icon-container">
      <svg id="android-monochrome" width="256" height="256" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
        <!-- Dollar sign circle -->
        <circle cx="512" cy="420" r="200" fill="none" stroke="white" stroke-width="12"/>
        
        <!-- Dollar sign -->
        <text x="512" y="470" text-anchor="middle" font-family="SF Pro Display, -apple-system, system-ui, sans-serif" font-size="280" font-weight="700" fill="white">$</text>
        
        <!-- SpendLog text -->
        <text x="512" y="780" text-anchor="middle" font-family="SF Pro Display, -apple-system, system-ui, sans-serif" font-size="140" font-weight="700" fill="white" letter-spacing="-4">spendlog</text>
      </svg>
      <span class="label">Android Monochrome</span>
    </div>
  </div>

  <div class="icon-row">
    <!-- Splash Icon -->
    <div class="icon-container">
      <svg id="splash-icon" width="200" height="200" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="bgGradient4" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#22C55E"/>
            <stop offset="100%" style="stop-color:#16A34A"/>
          </linearGradient>
        </defs>
        
        <!-- Dollar sign circle -->
        <circle cx="200" cy="160" r="80" fill="rgba(34,197,94,0.15)" stroke="#22C55E" stroke-width="6"/>
        
        <!-- Dollar sign -->
        <text x="200" y="185" text-anchor="middle" font-family="SF Pro Display, -apple-system, system-ui, sans-serif" font-size="110" font-weight="700" fill="#22C55E">$</text>
        
        <!-- SpendLog text -->
        <text x="200" y="310" text-anchor="middle" font-family="SF Pro Display, -apple-system, system-ui, sans-serif" font-size="56" font-weight="700" fill="#22C55E" letter-spacing="-2">spendlog</text>
        
        <!-- Bottom accent -->
        <rect x="120" y="330" width="160" height="4" rx="2" fill="rgba(34,197,94,0.4)"/>
      </svg>
      <span class="label">Splash Icon</span>
    </div>
  </div>

  <p style="color: #666; max-width: 600px; text-align: center; margin-top: 20px;">
    Right-click each icon and "Save image as..." or use a tool like <code style="background: #333; padding: 2px 6px; border-radius: 4px;">sharp</code> or an online converter to export these SVGs to PNG at the required sizes.
  </p>

  <script>
    // Helper to download SVG as file
    function downloadSVG(svgId, filename) {
      const svg = document.getElementById(svgId);
      const svgData = new XMLSerializer().serializeToString(svg);
      const blob = new Blob([svgData], {type: 'image/svg+xml'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      a.click();
      URL.revokeObjectURL(url);
    }
  </script>
</body>
</html>
