name: Android preview dev build

# Builds "Spendlog Preview" (com.spendlog.app.preview): a development build
# (expo-dev-client, debug variant) that installs next to the real app and loads
# its JavaScript from Metro on the developer's machine. Uploaded as a workflow
# artifact, never as a GitHub Release.
#
# Runs on every push to a `preview/**` branch, so it works before this file is
# on main. Once it is, a manual run can build any branch:
#   gh workflow run android-preview.yml -f ref=<branch>
# A JS-only change needs no rebuild; rebuild when a native module is added.
on:
  push:
    branches: ['preview/**']
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to build
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: android-preview-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

env:
  APP_VARIANT: preview
  EXPECTED_PACKAGE: com.spendlog.app.preview

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Add the preview app config if the ref predates it
        run: |
          # Without app.config.ts, APP_VARIANT is ignored and the build would be
          # com.spendlog.app; take the file from this workflow's commit instead.
          if [ ! -f app.config.ts ]; then
            git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
            git show "$GITHUB_SHA:app.config.ts" > app.config.ts
            echo "::notice::app.config.ts copied from $GITHUB_SHA"
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Install dependencies
        run: npm ci

      - name: Generate android project
        run: npx expo prebuild --platform android --no-install

      # Debug variant: with expo-dev-client this is the dev launcher, which
      # loads the bundle from Metro. arm64-v8a only, like the release build.
      - name: Build dev client APK (arm64-v8a)
        working-directory: android
        run: ./gradlew assembleDebug -PreactNativeArchitectures=arm64-v8a

      - name: Verify APK
        id: apk
        run: |
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          build_tools="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"

          badging=$("$build_tools/aapt2" dump badging "$apk")
          package_line=$(grep -m 1 '^package:' <<< "$badging" || true)
          echo "$package_line"
          grep -E '^(application-label|native-code|application-debuggable)' <<< "$badging" || true
          name=$(sed -n "s/.* name='\([^']*\)'.*/\1/p" <<< " $package_line")
          # Never produce an APK that would install over the real app.
          if [ "$name" != "$EXPECTED_PACKAGE" ]; then
            echo "::error::APK package is '$name', expected $EXPECTED_PACKAGE"
            exit 1
          fi
          if ! "$build_tools/aapt2" dump xmltree --file AndroidManifest.xml "$apk" \
            | grep -q 'expo.modules.devlauncher'; then
            echo "::error::APK has no expo-dev-client launcher"
            exit 1
          fi

          short=$(git rev-parse --short HEAD)
          out="spendlog-preview-dev-$short.apk"
          cp "$apk" "$out"
          echo "path=$out" >> "$GITHUB_OUTPUT"
          echo "name=spendlog-preview-dev-$short" >> "$GITHUB_OUTPUT"
          {
            echo "### $out"
            echo
            echo "Package \`$EXPECTED_PACKAGE\`, commit $(git rev-parse HEAD)."
            echo
            echo '```sh'
            echo "gh run download $GITHUB_RUN_ID --repo $GITHUB_REPOSITORY --name spendlog-preview-dev-$short"
            echo "scripts/preview-phone.sh install $out"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 30
