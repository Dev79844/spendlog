name: Android release APK

# Pushing a tag vMAJOR.MINOR.PATCH (on a commit that is on main) builds a
# release APK and publishes it as the GitHub Release for that tag. A manual
# run builds an existing tag's commit with this file as it is on the branch
# it was dispatched from, e.g. to rebuild a tag after fixing this workflow.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build (vMAJOR.MINOR.PATCH)
        required: true
        type: string
      dry_run:
        description: Build and verify only; don't publish a release
        type: boolean
        default: false

permissions:
  contents: write

# Publish releases one at a time.
concurrency:
  group: android-release
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  # Signing (see "Signing" in AGENTS.md): APK Signature Scheme v3.1 key
  # rotation from the public template debug key, which releases up to v1.3.0
  # were signed with, to the private release key in the SPENDLOG_KEYSTORE_*
  # secrets. android-signing/lineage.bin links the two.
  # SHA-256 of the private release key's certificate (alias spendlog).
  EXPECTED_SIGNER_SHA256: 37:CB:1F:DC:4F:CD:C3:0A:79:CC:72:E5:9F:1D:19:0D:AC:F8:5A:5A:6C:76:8B:E9:E1:99:24:D0:1B:E3:A1:3C
  SPENDLOG_KEY_ALIAS: spendlog
  # SHA-256 of the public React Native/Expo template debug.keystore (alias
  # androiddebugkey): the oldest key in the lineage, and still the signer for
  # Android 7-12.
  TEMPLATE_SIGNER_SHA256: FA:C6:17:45:DC:09:03:78:6F:B9:ED:E6:2A:96:2B:39:9F:73:48:F0:BB:6F:89:9B:83:32:66:75:91:03:3B:9C
  EXPECTED_PACKAGE: com.spendlog.app

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}
          # Full history, to check that the tag is on main.
          fetch-depth: 0

      - name: Check tag and derive version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # versionCode = MAJOR*10000 + MINOR*100 + PATCH. Prints nothing for a
          # tag that is not a strict vMAJOR.MINOR.PATCH with MINOR, PATCH < 100.
          version_code() {
            [[ "$1" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]?)\.(0|[1-9][0-9]?)$ ]] || return 0
            echo $(( BASH_REMATCH[1] * 10000 + BASH_REMATCH[2] * 100 + BASH_REMATCH[3] ))
          }

          code=$(version_code "$TAG")
          if [ -z "$code" ]; then
            echo "::error::Tag '$TAG' is not vMAJOR.MINOR.PATCH (no leading zeros, MINOR and PATCH < 100)"
            exit 1
          fi
          if [ "$code" -lt 2 ] || [ "$code" -gt 2100000000 ]; then
            echo "::error::versionCode $code from '$TAG' is outside 2..2100000000"
            exit 1
          fi

          commit=$(git rev-parse "refs/tags/$TAG^{commit}")
          if ! git merge-base --is-ancestor "$commit" origin/main; then
            echo "::error::Tag '$TAG' ($commit) is not on main"
            exit 1
          fi

          # The phone only accepts a higher versionCode, so refuse to publish
          # one that is not above every published release.
          published=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 \
            --json tagName,isDraft --jq '.[] | select(.isDraft | not) | .tagName')
          while read -r other; do
            other_code=$(version_code "$other")
            if [ -n "$other_code" ] && [ "$other_code" -ge "$code" ]; then
              echo "::error::Release $other (versionCode $other_code) is already published; $TAG has versionCode $code"
              exit 1
            fi
          done <<< "$published"

          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "name=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "$TAG: versionName ${TAG#v}, versionCode $code, commit $commit"

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Install dependencies
        run: npm ci

      - name: Set version in app.json
        env:
          VERSION_CODE: ${{ steps.version.outputs.code }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          # Only in the CI checkout: prebuild copies both into android/app/build.gradle.
          jq --arg vn "$VERSION_NAME" --argjson vc "$VERSION_CODE" \
            '.expo.version = $vn | .expo.android.versionCode = $vc' app.json > app.json.tmp
          mv app.json.tmp app.json

      - name: Generate android project
        run: npx expo prebuild --platform android --no-install

      # The prebuild template signs release builds with signingConfigs.debug,
      # i.e. android/app/debug.keystore; the next step re-signs the APK.
      # arm64-v8a only: the target phone is arm64 and the APK is much smaller.
      - name: Build release APK (arm64-v8a)
        working-directory: android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a

      # Fails closed: without both secrets, or with a keystore whose
      # certificate is not EXPECTED_SIGNER_SHA256, nothing is signed.
      - name: Sign APK with key rotation
        env:
          SPENDLOG_KEYSTORE_B64: ${{ secrets.SPENDLOG_KEYSTORE_B64 }}
          SPENDLOG_KEYSTORE_PASSWORD: ${{ secrets.SPENDLOG_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$SPENDLOG_KEYSTORE_B64" ] || [ -z "$SPENDLOG_KEYSTORE_PASSWORD" ]; then
            echo "::error::The SPENDLOG_KEYSTORE_B64 and SPENDLOG_KEYSTORE_PASSWORD secrets must be set (scripts/set-signing-secrets.sh)"
            exit 1
          fi
          build_tools="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"

          # The scripts and the lineage come from this workflow's own commit,
          # like release-pr-list.sh below: an older tag's tree may not have them.
          signing="$RUNNER_TEMP/signing"
          mkdir -p "$signing"
          for file in .github/scripts/sign-release-apk.sh .github/scripts/verify-apk-signers.sh \
            android-signing/lineage.bin; do
            git show "$GITHUB_SHA:$file" > "$signing/$(basename "$file")"
          done

          keystore="$RUNNER_TEMP/spendlog-release.p12"
          trap 'rm -f "$keystore"' EXIT
          (umask 077 && base64 -d <<< "$SPENDLOG_KEYSTORE_B64" > "$keystore")

          APKSIGNER="$build_tools/apksigner" \
          LINEAGE="$signing/lineage.bin" \
          TEMPLATE_KEYSTORE=android/app/debug.keystore \
          SPENDLOG_KEYSTORE="$keystore" \
            bash "$signing/sign-release-apk.sh" \
              android/app/build/outputs/apk/release/app-release.apk \
              "$RUNNER_TEMP/app-release-signed.apk"

      - name: Verify APK
        id: apk
        env:
          VERSION_CODE: ${{ steps.version.outputs.code }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          apk="$RUNNER_TEMP/app-release-signed.apk"
          build_tools="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"

          # v3.1 (Android 13+) with the private key, everything else with the
          # template key, lineage template -> private; any other signer fails.
          APKSIGNER="$build_tools/apksigner" \
            bash "$RUNNER_TEMP/signing/verify-apk-signers.sh" "$apk"

          badging=$("$build_tools/aapt2" dump badging "$apk")
          package_line=$(grep -m 1 '^package:' <<< "$badging" || true)
          echo "$package_line"
          grep -E '^(native-code|application-debuggable)' <<< "$badging" || true
          field() { sed -n "s/.* $1='\([^']*\)'.*/\1/p" <<< " $package_line"; }
          if [ "$(field name)" != "$EXPECTED_PACKAGE" ] \
            || [ "$(field versionCode)" != "$VERSION_CODE" ] \
            || [ "$(field versionName)" != "$VERSION_NAME" ]; then
            echo "::error::APK is $(field name) $(field versionCode) $(field versionName), expected $EXPECTED_PACKAGE $VERSION_CODE $VERSION_NAME"
            exit 1
          fi
          if grep -q '^application-debuggable' <<< "$badging"; then
            echo "::error::APK is debuggable"
            exit 1
          fi

          out="spendlog-$VERSION_NAME.apk"
          cp "$apk" "$out"
          echo "path=$out" >> "$GITHUB_OUTPUT"
          echo "size_mb=$(( $(stat -c %s "$out") / 1024 / 1024 ))" >> "$GITHUB_OUTPUT"

      # Runs on dry runs too, so a dry run shows the notes it would publish.
      - name: Write release notes
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          COMMIT: ${{ steps.version.outputs.commit }}
          APK: ${{ steps.apk.outputs.path }}
          SIZE_MB: ${{ steps.apk.outputs.size_mb }}
        run: |
          # Pull requests merged since the previous release. The script is read
          # from this workflow's own commit, not from the tag checkout: a manual
          # rebuild runs this file from the dispatched branch, and an older tag's
          # tree may not have the script. Any failure only drops the list.
          script="$RUNNER_TEMP/release-pr-list.sh"
          if git show "$GITHUB_SHA:.github/scripts/release-pr-list.sh" > "$script" \
            && bash "$script" > pr-list.md; then
            { cat pr-list.md; echo; } > notes.md
          else
            echo "::warning::Could not list the merged pull requests; the release notes have the build info only"
            : > notes.md
          fi

          cat >> notes.md <<NOTES
          Release APK for \`$EXPECTED_PACKAGE\`, arm64-v8a only.

          | | |
          | --- | --- |
          | Commit | $COMMIT |
          | versionName | $VERSION_NAME |
          | versionCode | $VERSION_CODE |
          | Built | $(date -u +%Y-%m-%dT%H:%M:%SZ) |
          | Signer SHA-256 (Android 13+) | \`$EXPECTED_SIGNER_SHA256\` |
          | Rotated from | \`$TEMPLATE_SIGNER_SHA256\` |
          | Size | ${SIZE_MB} MB |

          Install over the existing app (never uninstall: the app holds the only copy of the data):

          \`\`\`sh
          gh release download $TAG --repo $GITHUB_REPOSITORY --pattern '*.apk'
          adb install -r $APK
          \`\`\`
          NOTES
          cat notes.md

      - name: Publish GitHub Release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          APK: ${{ steps.apk.outputs.path }}
        run: |
          # --verify-tag: publish on the pushed tag, never create a new one.
          gh release create "$TAG" "$APK" \
            --verify-tag \
            --title "Spendlog $VERSION_NAME" \
            --notes-file notes.md \
            --latest
