name: Android release APK

# Every push to main builds a release APK and publishes it as a GitHub Release.
# Releases and tags made with GITHUB_TOKEN never trigger workflows, and this
# workflow only listens to branch pushes, so publishing cannot loop.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Publish releases one at a time, in push order.
concurrency:
  group: android-release
  cancel-in-progress: false

env:
  # SHA-256 of the public React Native/Expo template debug.keystore
  # (alias androiddebugkey). The installed app is signed with it, so any
  # other key would make `adb install -r` fail.
  EXPECTED_SIGNER_SHA256: FA:C6:17:45:DC:09:03:78:6F:B9:ED:E6:2A:96:2B:39:9F:73:48:F0:BB:6F:89:9B:83:32:66:75:91:03:3B:9C
  EXPECTED_PACKAGE: com.spendlog.app
  # The installed build has versionCode 1; build N gets run_number + offset.
  VERSION_CODE_OFFSET: 1

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Install dependencies
        run: npm ci

      - name: Set version
        id: version
        run: |
          version_code=$(( GITHUB_RUN_NUMBER + VERSION_CODE_OFFSET ))
          version_name=$(jq -r '.expo.version' app.json)
          # Only in the CI checkout: prebuild copies it into android/app/build.gradle.
          jq --argjson vc "$version_code" '.expo.android.versionCode = $vc' app.json > app.json.tmp
          mv app.json.tmp app.json
          echo "code=$version_code" >> "$GITHUB_OUTPUT"
          echo "name=$version_name" >> "$GITHUB_OUTPUT"
          echo "versionName $version_name, versionCode $version_code"

      - name: Generate android project
        run: npx expo prebuild --platform android --no-install

      # The prebuild template signs release builds with signingConfigs.debug,
      # i.e. android/app/debug.keystore; the verify step below enforces it.
      - name: Build release APK (arm64-v8a)
        working-directory: android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a

      - name: Verify APK
        id: apk
        env:
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          apk=android/app/build/outputs/apk/release/app-release.apk
          build_tools="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"

          certs=$("$build_tools/apksigner" verify --print-certs "$apk")
          echo "$certs"
          signers=$(grep -c '^Signer #[0-9]* certificate SHA-256 digest:' <<< "$certs" || true)
          actual=$(grep '^Signer #1 certificate SHA-256 digest:' <<< "$certs" | awk '{print $NF}' || true)
          expected=$(tr -d ':' <<< "$EXPECTED_SIGNER_SHA256" | tr 'A-F' 'a-f')
          if [ "$signers" != 1 ] || [ "$actual" != "$expected" ]; then
            echo "::error::APK signer is $actual ($signers signers), expected $expected"
            exit 1
          fi

          badging=$("$build_tools/aapt2" dump badging "$apk")
          grep -E '^(package|native-code|application-debuggable)' <<< "$badging" || true
          if ! grep -q "^package: name='$EXPECTED_PACKAGE' versionCode='$VERSION_CODE' " <<< "$badging"; then
            echo "::error::APK package or versionCode is not $EXPECTED_PACKAGE / $VERSION_CODE"
            exit 1
          fi
          if grep -q '^application-debuggable' <<< "$badging"; then
            echo "::error::APK is debuggable"
            exit 1
          fi

          out="spendlog-$VERSION_CODE.apk"
          cp "$apk" "$out"
          echo "path=$out" >> "$GITHUB_OUTPUT"
          echo "size_mb=$(( $(stat -c %s "$out") / 1024 / 1024 ))" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          APK: ${{ steps.apk.outputs.path }}
          SIZE_MB: ${{ steps.apk.outputs.size_mb }}
        run: |
          tag="build-$VERSION_CODE"
          cat > notes.md <<NOTES
          Release APK for \`$EXPECTED_PACKAGE\`, arm64-v8a only.

          | | |
          | --- | --- |
          | Commit | $GITHUB_SHA |
          | versionName | $VERSION_NAME |
          | versionCode | $VERSION_CODE |
          | Built | $(date -u +%Y-%m-%dT%H:%M:%SZ) |
          | Signer SHA-256 | \`$EXPECTED_SIGNER_SHA256\` |
          | Size | ${SIZE_MB} MB |

          Install over the existing app (never uninstall: the app holds the only copy of the data):

          \`\`\`sh
          gh release download $tag --repo $GITHUB_REPOSITORY --pattern '*.apk'
          adb install -r $APK
          \`\`\`
          NOTES

          if gh release view "$tag" > /dev/null 2>&1; then
            # A re-run of the same workflow run: same commit, same versionCode.
            gh release upload "$tag" "$APK" --clobber
            gh release edit "$tag" --notes-file notes.md --latest
          else
            gh release create "$tag" "$APK" \
              --target "$GITHUB_SHA" \
              --title "Spendlog $VERSION_NAME (build $VERSION_CODE)" \
              --notes-file notes.md \
              --latest
          fi
